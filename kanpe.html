<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遠隔カンペ</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    background: #111;
    color: #fff;
    overflow: hidden;
  }
  /* 画面は3つ(モード選択/表示用/操作用)。.active が付いた1つだけが見える */
  .screen { display: none; height: 100%; }
  .screen.active { display: flex; }

  /* ---------- モード選択 ---------- */
  #modeSelect {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }
  #modeSelect h1 { font-size: 28px; margin-bottom: 8px; }
  #modeSelect button {
    width: 320px;
    padding: 28px;
    font-size: 24px;
    font-weight: bold;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    color: #fff;
  }
  #btnDisplayMode { background: #2e7d32; }
  #btnCtrlMode { background: #1565c0; }
  #modeSelect .hint { color: #999; font-size: 14px; text-align: center; line-height: 1.7; }

  /* ---------- 表示用(スピーカー足元) ---------- */
  /* 背景色はメッセージごとにJS(renderMsg)から上書きされる */
  #display {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    background: #111;
    transition: background 0.2s;
  }
  /* 緊急時の点滅。--bc(点滅色)はJSからセットされる。0.7s が点滅の周期 */
  #display.blink { animation: flash 0.7s steps(1) infinite; }
  @keyframes flash {
    0%   { background: var(--bc, #c62828); }
    50%  { background: #1a1a1a; }
  }
  /* カンペ本文。font-size はここでは決めず、JSの fitText() が毎回計算する */
  #msgText {
    font-weight: 900;
    color: #fff;
    text-align: center;
    line-height: 1.2;
    padding: 0 4vw;
    word-break: normal;
    overflow-wrap: anywhere;
    line-break: anywhere;
  }
  /* 最初のメッセージが届くまで出ている待機表示(ルーム名の案内) */
  #waitBox { text-align: center; }
  #waitBox .code {
    font-size: 12vw;
    font-weight: 900;
    letter-spacing: 0.1em;
    color: #ffd54f;
  }
  #waitBox p { font-size: 22px; color: #ccc; margin-top: 16px; line-height: 1.8; }
  /* 左上の接続状態バッジ。ok=緑 / ng=赤 / クラスなし=灰(接続中) */
  #connBadge {
    position: absolute;
    top: 12px;
    left: 12px;
    font-size: 14px;
    padding: 4px 12px;
    border-radius: 999px;
    background: #333;
    color: #aaa;
  }
  #connBadge.ok { background: #1b5e20; color: #a5d6a7; }
  #connBadge.ng { background: #b71c1c; color: #ffcdd2; }
  #fsBtn {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 6px 14px;
    font-size: 14px;
    background: #333;
    color: #ccc;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    opacity: 0.7;
  }

  /* ---------- 操作用(タイムキーパー) ---------- */
  #ctrl {
    flex-direction: column;
    padding: 16px;
    gap: 12px;
    overflow-y: auto;
  }
  #ctrl .topbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #ctrl .topbar input {
    font-size: 22px;
    padding: 8px 12px;
    width: 160px;
    border-radius: 8px;
    border: 1px solid #555;
    background: #222;
    color: #ffd54f;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  #ctrl .topbar button {
    font-size: 16px;
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: #1565c0;
    color: #fff;
    cursor: pointer;
  }
  /* 接続状態の文字。ok=緑 / ng=赤 */
  #ctrlStatus { font-size: 15px; color: #aaa; }
  #ctrlStatus.ok { color: #81c784; }
  #ctrlStatus.ng { color: #e57373; }

  /* 「現在の表示」欄。表示側に実際に出ている内容の確認用 */
  #nowShowing {
    background: #222;
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 15px;
    color: #999;
  }
  #nowShowing b { color: #fff; font-size: 20px; margin-left: 8px; }

  /* 定型ボタンの並び。ボタンを増減しても自動で折り返す */
  .btnGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
  }
  .btnGrid button {
    padding: 22px 8px;
    font-size: 20px;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    color: #fff;
    cursor: pointer;
  }
  .btnGrid button:active { transform: scale(0.96); }
  /* ↓ 現在は未使用(各ボタンの色は HTML 側の style で直接指定している) */
  .b-go     { background: #2e7d32; }
  .b-info   { background: #1565c0; }
  .b-time   { background: #b8860b; }
  .b-urgent { background: #c62828; }
  .b-clear  { background: #424242; }

  .freeRow { display: flex; gap: 8px; flex-wrap: wrap; }
  .freeRow input[type=text] {
    flex: 1;
    min-width: 200px;
    font-size: 20px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #555;
    background: #222;
    color: #fff;
  }
  .freeRow button {
    font-size: 17px;
    font-weight: bold;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
  }
  #sendFree { background: #1565c0; }
  #sendFreeUrgent { background: #c62828; }
  .sectionLabel { font-size: 13px; color: #888; margin-top: 4px; }
  /* firebaseConfig が空のときだけ全画面で出るエラー表示 */
  #configError {
    display: none;
    position: fixed;
    inset: 0;
    background: #111;
    color: #ef9a9a;
    padding: 40px;
    font-size: 20px;
    line-height: 2;
    z-index: 99;
  }
</style>
</head>
<body>

<div id="configError">Firebaseの設定がまだ入っていません。<br>kanpe.html内の firebaseConfig にFirebaseコンソールの設定値を貼り付けてください。</div>

<!-- モード選択 -->
<div id="modeSelect" class="screen active">
  <h1>遠隔カンペ</h1>
  <button id="btnDisplayMode">表示用<br><span style="font-size:15px;font-weight:normal">(スピーカー足元のPC)</span></button>
  <button id="btnCtrlMode">操作用<br><span style="font-size:15px;font-weight:normal">(タイムキーパーのPC)</span></button>
  <p class="hint">両PCで同じルーム名を使えばつながります。<br>URLに ?mode=display&room=TEDX2026 を付ければこの画面をスキップできます。</p>
</div>

<!-- 表示用 -->
<!-- waitBox(待機表示)と msgText(カンペ本文)は、最初のメッセージ受信時に入れ替わる -->
<div id="display" class="screen bg-normal">
  <span id="connBadge">接続中...</span>
  <button id="fsBtn">全画面</button>
  <div id="waitBox">
    <div>ルーム名</div>
    <div class="code" id="roomCode">----</div>
    <p>タイムキーパー側で同じルーム名に接続してください。<br>右上のボタンで全画面にできます。</p>
  </div>
  <div id="msgText" style="display:none"></div>
</div>

<!-- 操作用 -->
<div id="ctrl" class="screen">
  <div class="topbar">
    <label>ルーム名:</label>
    <input id="codeInput" maxlength="24" placeholder="TEDX2026">
    <button id="connectBtn">接続</button>
    <span id="ctrlStatus">未接続</span>
  </div>
  <div id="nowShowing">現在の表示:<b id="nowText">—</b></div>

  <!--
    ▼ 定型ボタンの書き方(増やす・変えるときはここの <button> を編集するだけでよい)
      data-text  … 表示側に出す文字(空にすると「クリア」になる)
      data-color … 表示側の背景色
      style      … 操作画面でのボタン自体の色(data-color と同じ色にそろえる)
      data-blink="1" を足すと、表示側で点滅する(現在使っているボタンはない)
      ボタンの見出し(タグの中の文字)は操作画面用で、data-text と別にできる
    定型ボタンのメッセージは、表示側で必ず1行・画面幅いっぱいで出る。
    長い文言にするとその分文字が小さくなるので注意。
  -->
  <div class="sectionLabel">進行指示</div>
  <div class="btnGrid">
    <button style="background:#cc0000" data-color="#cc0000" data-text="GO">GO</button>
    <button style="background:#f0a000" data-color="#f0a000" data-text="OK">OK</button>
    <button style="background:#f0a000" data-color="#f0a000" data-text="次行って">次行って</button>
    <button style="background:#f0a000" data-color="#f0a000" data-text="休憩にしてOK">休憩にしてOK</button>
    <button style="background:#1a1aff" data-color="#1a1aff" data-text="巻いて">巻いて</button>
    <button style="background:#1a1aff" data-color="#1a1aff" data-text="少し早口で">少し早口で</button>
    <button style="background:#38761d" data-color="#38761d" data-text="のばして">のばして</button>
    <button style="background:#424242" data-text="">クリア(消す)</button>
  </div>

  <div class="sectionLabel">時間</div>
  <div class="btnGrid">
    <button style="background:#85200c" data-color="#85200c" data-text="10分経過">10分経過</button>
    <button style="background:#85200c" data-color="#85200c" data-text="15分経過">15分経過</button>
    <button style="background:#4a86e8" data-color="#4a86e8" data-text="残り5分">残り5分</button>
    <button style="background:#4a86e8" data-color="#4a86e8" data-text="残り3分">残り3分</button>
    <button style="background:#4a86e8" data-color="#4a86e8" data-text="残り2分">残り2分</button>
    <button style="background:#073763" data-color="#073763" data-text="残り1分">残り1分</button>
  </div>

  <!-- 自由入力は、表示側で文字数に応じて2〜4行に折り返される(定型ボタンとは別の扱い) -->
  <div class="sectionLabel">自由入力(Enterで通常送信)</div>
  <div class="freeRow">
    <input type="text" id="freeText" placeholder="自由メッセージ">
    <button id="sendFree">送信</button>
    <button id="sendFreeUrgent">緊急(点滅)で送信</button>
  </div>
</div>

<script>
(function () {
  // ▼ 接続先のFirebase。別のプロジェクトに移すときはここを書き換える。
  //   このURLは公開されても問題ない値だが、誰が読み書きできるかは
  //   Firebaseコンソール側の「ルール」で決まるので、そちらの設定に注意。
  const firebaseConfig = {
    databaseURL: "https://tedxutsukubakanpe-default-rtdb.asia-southeast1.firebasedatabase.app" //要書き換え
  };

  if (!firebaseConfig || !firebaseConfig.databaseURL) {
    document.getElementById("configError").style.display = "block";
    return;
  }
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // ---- この端末の状態 ----
  let room = null;        // 接続中のルーム名(英大文字と数字のみ)
  let role = null;        // "display"(表示用) か "ctrl"(操作用)
  let lastPeerSeen = 0;   // 相手側ハートビートを最後に受信した時刻(ローカル時計)
  let watchTimer = null;  // 相手の生存を定期チェックするタイマー
  let hbTimer = null;     // 自分のハートビートを送るタイマー

  // ---- 小さな道具 ----
  const $ = (id) => document.getElementById(id);
  // 指定した画面だけを見せる("modeSelect" / "display" / "ctrl")
  const show = (id) => {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    $(id).classList.add("active");
  };
  // 今のルーム配下のデータの場所を返す。例: roomRef("current") → rooms/TEDX2026/current
  const roomRef = (path) => db.ref("rooms/" + room + "/" + path);

  /* ============ 共通: 死活監視 ============ */
  // 自分のハートビートを3秒ごとに書き込み、相手のハートビート更新イベントで生存確認
  //   me / other … "display" か "ctrl"(自分と相手の役割名)
  //   onStatus(alive, offline, denied) … 状態が変わるたびに呼ばれ、画面表示を更新する
  //     alive   = 相手が生きている
  //     offline = 自分がネットにつながっていない
  //     denied  = Firebaseのルールで読み取りを拒否された
  function startPresence(me, other, onStatus) {
    hbTimer = setInterval(() => {
      roomRef("presence/" + me).set(firebase.database.ServerValue.TIMESTAMP);
    }, 3000);
    roomRef("presence/" + me).set(firebase.database.ServerValue.TIMESTAMP);
    // タブを閉じたり回線が切れたりしたら、サーバー側で自分の印を自動で消してもらう
    roomRef("presence/" + me).onDisconnect().remove();

    // Firebaseのルールで読み取りを拒否された場合は、その旨を画面に出す
    let denied = false;
    roomRef("presence/" + other).on("value", (snap) => {
      if (snap.val() !== null) lastPeerSeen = Date.now();
    }, () => { denied = true; onStatus(false, false, true); });
    // 2秒ごとに判定。相手の更新が9秒(=ハートビート3回分)途絶えたら「応答なし」とみなす
    watchTimer = setInterval(() => {
      if (denied) onStatus(false, false, true);
      else onStatus(Date.now() - lastPeerSeen < 9000);
    }, 2000);

    // .info/connected は Firebase が用意している「自分がつながっているか」の特別な場所
    db.ref(".info/connected").on("value", (snap) => {
      if (!snap.val()) onStatus(false, true);
    });
  }

  /* ============ 表示用 ============ */
  function startDisplay(roomName) {
    role = "display";
    room = roomName;
    show("display");
    $("roomCode").textContent = room;

    // メッセージが書き換わるたびに画面を描き直す。
    // 開いた時点ですでにメッセージがあれば、それもすぐ表示される(再読み込みしても復帰する)
    roomRef("current").on("value", (snap) => {
      const d = snap.val();
      if (d && typeof d.text === "string") renderMsg(d.text, d.color, !!d.blink, !!d.fixed);
    });

    startPresence("display", "ctrl", (alive, offline, denied) => {
      if (denied) setBadge("Firebaseに拒否されました(ルールを確認)", "ng");
      else if (offline) setBadge("ネット接続なし", "ng");
      else if (alive) setBadge("操作側と接続中", "ok");
      else setBadge("操作側の応答なし", "ng");
    });
  }

  // メッセージ1件を画面に出す
  //   text  … 表示する文字(空文字ならクリア=真っ暗)
  //   color … 背景色  /  blink … 点滅するか  /  fixed … 定型ボタン由来か(1行表示にする)
  function renderMsg(text, color, blink, fixed) {
    const disp = $("display");
    $("waitBox").style.display = "none";
    const el = $("msgText");
    el.style.display = "block";
    disp.classList.remove("blink");
    if (text === "") {
      el.textContent = "";
      disp.style.background = "#111";
    } else {
      el.textContent = text;
      fitText(el, text, fixed);
      disp.style.background = color || "#111";
      if (blink) {
        disp.style.setProperty("--bc", color || "#cc0000");
        disp.classList.add("blink");
      }
    }
  }

  // 文字サイズを決める。単位の vw は「画面幅の何%か」(画面の大きさが違っても同じ見え方になる)
  function fitText(el, text, oneLine) {
    if (oneLine) {
      // 定型ボタン: 必ず1行のまま、画面幅いっぱいの最大サイズに(実測でフィット)
      el.style.whiteSpace = "nowrap";
      el.style.fontSize = "32vw";
      const avail = document.documentElement.clientWidth * 0.96;
      const w = el.scrollWidth;
      if (w > avail) el.style.fontSize = (32 * avail / w) + "vw";
      return;
    }
    // 自由入力: 2〜4行に折り返して大きさを確保
    el.style.whiteSpace = "normal";
    const len = [...text].length;   // 絵文字なども1文字として数える
    // 文字数 → 行数の目安(ここの数字を変えると折り返し方が変わる)
    let lines;
    if (len <= 5) lines = 1;
    else if (len <= 16) lines = 2;
    else if (len <= 30) lines = 3;
    else lines = 4;
    const perLine = Math.ceil(len / lines);
    // 3つの条件のうち一番小さいサイズを採用する
    const vw = Math.min(
      94 / perLine,        // 横幅に収まるサイズ
      28,                  // 上限
      48 / (1.2 * lines)   // 縦に収まるサイズ
    );
    el.style.fontSize = vw + "vw";
  }

  // 表示側 左上のバッジを書き換える(cls: "ok" / "ng" / 省略)
  function setBadge(text, cls) {
    const b = $("connBadge");
    b.textContent = text;
    b.className = cls || "";
  }

  // 全画面の切り替え(ブラウザの仕様上、ユーザーのクリック操作からしか全画面にできない)
  $("fsBtn").addEventListener("click", () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  });

  /* ============ 操作用 ============ */
  // roomName があれば(URLで指定されていれば)そのまま接続。
  // なければ前回使ったルーム名を入力欄に入れておくだけで、接続ボタンを待つ
  function startCtrl(roomName) {
    role = "ctrl";
    show("ctrl");
    if (roomName) {
      $("codeInput").value = roomName;
      connect();
    } else {
      const saved = localStorage.getItem("kanpeRoom");
      if (saved) $("codeInput").value = saved;
    }
  }

  // 入力欄のルーム名で接続する(接続中に別のルーム名へつなぎ直すこともできる)
  function connect() {
    // ルーム名は大文字に統一し、英数字以外は取り除く(表示側と表記ゆれで食い違わないように)
    const r = $("codeInput").value.trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (r.length < 2) { setCtrlStatus("ルーム名は英数字2文字以上", "ng"); return; }
    localStorage.setItem("kanpeRoom", r);   // 次回のためにこのブラウザに覚えさせる

    // 前のルームの監視を解除
    if (room) {
      roomRef("current").off();
      roomRef("presence/display").off();
    }
    if (hbTimer) clearInterval(hbTimer);
    if (watchTimer) clearInterval(watchTimer);

    room = r;
    setCtrlStatus("接続中...", "");

    // 「現在の表示」欄を更新。自分が送った内容ではなくサーバー上の値を見ているので、
    // ここに出ていれば送信は成功している
    roomRef("current").on("value", (snap) => {
      const d = snap.val();
      if (d && typeof d.text === "string") {
        $("nowText").textContent = d.text === "" ? "(クリア)" : d.text;
      }
    });

    startPresence("ctrl", "display", (alive, offline, denied) => {
      if (denied) setCtrlStatus("Firebaseに拒否されました(ルールを確認)", "ng");
      else if (offline) setCtrlStatus("ネット接続なし", "ng");
      else if (alive) setCtrlStatus("表示側と接続OK", "ok");
      else setCtrlStatus("表示側が見つかりません(表示側を開いてください)", "ng");
    });
  }

  // メッセージを送る(= rooms/<ルーム名>/current を上書きする)。
  // 履歴は残らず、常に最新の1件だけが保存される
  function sendMsg(text, color, blink, fixed) {
    if (!room) { setCtrlStatus("先にルームへ接続してください", "ng"); return; }
    roomRef("current").set({ text, color: color || null, blink: !!blink, fixed: !!fixed, ts: firebase.database.ServerValue.TIMESTAMP })
      .catch(() => setCtrlStatus("送信失敗 — ネットとFirebaseルールを確認", "ng"));
  }

  // 操作側 上部の接続状態の文字を書き換える(cls: "ok" / "ng" / 空)
  function setCtrlStatus(text, cls) {
    const s = $("ctrlStatus");
    s.textContent = text;
    s.className = cls || "";
  }

  /* ============ イベント ============ */
  // モード選択画面のボタン
  $("btnDisplayMode").addEventListener("click", () => startDisplay(promptRoom()));
  $("btnCtrlMode").addEventListener("click", () => startCtrl());
  $("connectBtn").addEventListener("click", connect);
  $("codeInput").addEventListener("keydown", (e) => { if (e.key === "Enter") connect(); });

  // 表示用を選んだときにルーム名をたずねる(空欄やキャンセルなら前回の名前、なければ TEDX2026)
  function promptRoom() {
    const saved = localStorage.getItem("kanpeRoom") || "TEDX2026";
    const r = (prompt("ルーム名(操作側と同じにする):", saved) || saved)
      .trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
    localStorage.setItem("kanpeRoom", r);
    return r || "TEDX2026";
  }

  // 定型ボタン: HTML側の data-text / data-color / data-blink をそのまま送る。
  // .btnGrid 内のボタンすべてに自動で付くので、HTMLにボタンを足すだけで動く
  document.querySelectorAll(".btnGrid button").forEach(b => {
    b.addEventListener("click", () => sendMsg(b.dataset.text, b.dataset.color || null, b.dataset.blink === "1", true));
  });
  // 自由入力
  $("sendFree").addEventListener("click", () => sendFreeMsg(false));
  $("sendFreeUrgent").addEventListener("click", () => sendFreeMsg(true));
  $("freeText").addEventListener("keydown", (e) => { if (e.key === "Enter") sendFreeMsg(false); });
  // urgent=true なら赤背景で点滅、false なら青背景。送信後は入力欄を空にして続けて打てるようにする
  function sendFreeMsg(urgent) {
    const t = $("freeText").value.trim();
    if (!t) return;
    sendMsg(t, urgent ? "#cc0000" : "#1565c0", urgent, false);
    $("freeText").value = "";
    $("freeText").focus();
  }

  // URLパラメータで自動起動: ?mode=display&room=TEDX2026 / ?mode=ctrl&room=TEDX2026
  (function autoStart() {
    const p = new URLSearchParams(location.search);
    const mode = (p.get("mode") || "").toLowerCase();
    const r = (p.get("room") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (mode === "display") startDisplay(r || "TEDX2026");
    else if (mode === "ctrl") startCtrl(r || null);
  })();
})();
</script>
</body>
</html>
