<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遠隔カンペ</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    background: #111;
    color: #fff;
    overflow: hidden;
  }
  .screen { display: none; height: 100%; }
  .screen.active { display: flex; }

  /* ---------- モード選択 ---------- */
  #modeSelect {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
  }
  #modeSelect h1 { font-size: 28px; margin-bottom: 8px; }
  #modeSelect button {
    width: 320px;
    padding: 28px;
    font-size: 24px;
    font-weight: bold;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    color: #fff;
  }
  #btnDisplayMode { background: #2e7d32; }
  #btnCtrlMode { background: #1565c0; }
  #modeSelect .hint { color: #999; font-size: 14px; text-align: center; line-height: 1.7; }

  /* ---------- 表示用(スピーカー足元) ---------- */
  #display {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    background: #111;
    transition: background 0.2s;
  }
  #display.blink { animation: flash 0.7s steps(1) infinite; }
  @keyframes flash {
    0%   { background: var(--bc, #c62828); }
    50%  { background: #1a1a1a; }
  }
  #msgText {
    font-weight: 900;
    text-align: center;
    line-height: 1.2;
    padding: 0 4vw;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  #waitBox { text-align: center; }
  #waitBox .code {
    font-size: 12vw;
    font-weight: 900;
    letter-spacing: 0.1em;
    color: #ffd54f;
  }
  #waitBox p { font-size: 22px; color: #ccc; margin-top: 16px; line-height: 1.8; }
  #connBadge {
    position: absolute;
    top: 12px;
    left: 12px;
    font-size: 14px;
    padding: 4px 12px;
    border-radius: 999px;
    background: #333;
    color: #aaa;
  }
  #connBadge.ok { background: #1b5e20; color: #a5d6a7; }
  #connBadge.ng { background: #b71c1c; color: #ffcdd2; }
  #fsBtn {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 6px 14px;
    font-size: 14px;
    background: #333;
    color: #ccc;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    opacity: 0.7;
  }

  /* ---------- 操作用(タイムキーパー) ---------- */
  #ctrl {
    flex-direction: column;
    padding: 16px;
    gap: 12px;
    overflow-y: auto;
  }
  #ctrl .topbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #ctrl .topbar input {
    font-size: 22px;
    padding: 8px 12px;
    width: 160px;
    border-radius: 8px;
    border: 1px solid #555;
    background: #222;
    color: #ffd54f;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  #ctrl .topbar button {
    font-size: 16px;
    padding: 10px 18px;
    border: none;
    border-radius: 8px;
    background: #1565c0;
    color: #fff;
    cursor: pointer;
  }
  #ctrlStatus { font-size: 15px; color: #aaa; }
  #ctrlStatus.ok { color: #81c784; }
  #ctrlStatus.ng { color: #e57373; }

  #nowShowing {
    background: #222;
    border-radius: 12px;
    padding: 10px 16px;
    font-size: 15px;
    color: #999;
  }
  #nowShowing b { color: #fff; font-size: 20px; margin-left: 8px; }

  .btnGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
  }
  .btnGrid button {
    padding: 22px 8px;
    font-size: 20px;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    color: #fff;
    cursor: pointer;
  }
  .btnGrid button:active { transform: scale(0.96); }
  .b-go     { background: #2e7d32; }
  .b-info   { background: #1565c0; }
  .b-time   { background: #b8860b; }
  .b-urgent { background: #c62828; }
  .b-clear  { background: #424242; }

  .freeRow { display: flex; gap: 8px; flex-wrap: wrap; }
  .freeRow input[type=text] {
    flex: 1;
    min-width: 200px;
    font-size: 20px;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #555;
    background: #222;
    color: #fff;
  }
  .freeRow button {
    font-size: 17px;
    font-weight: bold;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
  }
  #sendFree { background: #1565c0; }
  #sendFreeUrgent { background: #c62828; }
  .sectionLabel { font-size: 13px; color: #888; margin-top: 4px; }
  #configError {
    display: none;
    position: fixed;
    inset: 0;
    background: #111;
    color: #ef9a9a;
    padding: 40px;
    font-size: 20px;
    line-height: 2;
    z-index: 99;
  }
</style>
</head>
<body>

<div id="configError">Firebaseの設定がまだ入っていません。<br>kanpe.html内の firebaseConfig にFirebaseコンソールの設定値を貼り付けてください。</div>

<!-- モード選択 -->
<div id="modeSelect" class="screen active">
  <h1>遠隔カンペ</h1>
  <button id="btnDisplayMode">表示用<br><span style="font-size:15px;font-weight:normal">(スピーカー足元のPC)</span></button>
  <button id="btnCtrlMode">操作用<br><span style="font-size:15px;font-weight:normal">(タイムキーパーのPC)</span></button>
  <p class="hint">両PCで同じルーム名を使えばつながります。<br>URLに ?mode=display&room=TEDX2026 を付ければこの画面をスキップできます。</p>
</div>

<!-- 表示用 -->
<div id="display" class="screen bg-normal">
  <span id="connBadge">接続中...</span>
  <button id="fsBtn">全画面</button>
  <div id="waitBox">
    <div>ルーム名</div>
    <div class="code" id="roomCode">----</div>
    <p>タイムキーパー側で同じルーム名に接続してください。<br>右上のボタンで全画面にできます。</p>
  </div>
  <div id="msgText" style="display:none"></div>
</div>

<!-- 操作用 -->
<div id="ctrl" class="screen">
  <div class="topbar">
    <label>ルーム名:</label>
    <input id="codeInput" maxlength="24" placeholder="TEDX2026">
    <button id="connectBtn">接続</button>
    <span id="ctrlStatus">未接続</span>
  </div>
  <div id="nowShowing">現在の表示:<b id="nowText">—</b></div>

  <div class="sectionLabel">進行指示</div>
  <div class="btnGrid">
    <button style="background:#cc0000" data-color="#cc0000" data-text="GO">GO</button>
    <button style="background:#f0a000" data-color="#f0a000" data-text="OK">OK</button>
    <button style="background:#f0a000" data-color="#f0a000" data-text="次行って">次行って</button>
    <button style="background:#f0a000" data-color="#f0a000" data-text="休憩にしてOK">休憩にしてOK</button>
    <button style="background:#1a1aff" data-color="#1a1aff" data-text="巻いて">巻いて</button>
    <button style="background:#1a1aff" data-color="#1a1aff" data-text="少し早口で">少し早口で</button>
    <button style="background:#38761d" data-color="#38761d" data-text="のばして">のばして</button>
    <button style="background:#424242" data-text="">クリア(消す)</button>
  </div>

  <div class="sectionLabel">時間</div>
  <div class="btnGrid">
    <button style="background:#85200c" data-color="#85200c" data-text="10分経過">10分経過</button>
    <button style="background:#85200c" data-color="#85200c" data-text="15分経過">15分経過</button>
    <button style="background:#4a86e8" data-color="#4a86e8" data-text="残り5分">残り5分</button>
    <button style="background:#4a86e8" data-color="#4a86e8" data-text="残り3分">残り3分</button>
    <button style="background:#4a86e8" data-color="#4a86e8" data-text="残り2分">残り2分</button>
    <button style="background:#073763" data-color="#073763" data-text="残り1分">残り1分</button>
  </div>

  <div class="sectionLabel">自由入力(Enterで通常送信)</div>
  <div class="freeRow">
    <input type="text" id="freeText" placeholder="自由メッセージ">
    <button id="sendFree">送信</button>
    <button id="sendFreeUrgent">緊急(点滅)で送信</button>
  </div>
</div>

<script>
(function () {
  const firebaseConfig = {
    databaseURL: "https://tedxutsukubakanpe-default-rtdb.asia-southeast1.firebasedatabase.app"
  };

  if (!firebaseConfig) {
    document.getElementById("configError").style.display = "block";
    return;
  }
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let room = null;
  let role = null;
  let lastPeerSeen = 0;   // 相手側ハートビートを最後に受信した時刻(ローカル時計)
  let watchTimer = null;
  let hbTimer = null;

  const $ = (id) => document.getElementById(id);
  const show = (id) => {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    $(id).classList.add("active");
  };
  const roomRef = (path) => db.ref("rooms/" + room + "/" + path);

  /* ============ 共通: 死活監視 ============ */
  // 自分のハートビートを3秒ごとに書き込み、相手のハートビート更新イベントで生存確認
  function startPresence(me, other, onStatus) {
    hbTimer = setInterval(() => {
      roomRef("presence/" + me).set(firebase.database.ServerValue.TIMESTAMP);
    }, 3000);
    roomRef("presence/" + me).set(firebase.database.ServerValue.TIMESTAMP);
    roomRef("presence/" + me).onDisconnect().remove();

    roomRef("presence/" + other).on("value", (snap) => {
      if (snap.val() !== null) lastPeerSeen = Date.now();
    });
    watchTimer = setInterval(() => {
      onStatus(Date.now() - lastPeerSeen < 9000);
    }, 2000);

    db.ref(".info/connected").on("value", (snap) => {
      if (!snap.val()) onStatus(false, true);
    });
  }

  /* ============ 表示用 ============ */
  function startDisplay(roomName) {
    role = "display";
    room = roomName;
    show("display");
    $("roomCode").textContent = room;

    roomRef("current").on("value", (snap) => {
      const d = snap.val();
      if (d && typeof d.text === "string") renderMsg(d.text, d.color, !!d.blink);
    });

    startPresence("display", "ctrl", (alive, offline) => {
      if (offline) setBadge("ネット接続なし", "ng");
      else if (alive) setBadge("操作側と接続中", "ok");
      else setBadge("操作側の応答なし", "ng");
    });
  }

  function renderMsg(text, color, blink) {
    const disp = $("display");
    $("waitBox").style.display = "none";
    const el = $("msgText");
    el.style.display = "block";
    disp.classList.remove("blink");
    if (text === "") {
      el.textContent = "";
      disp.style.background = "#111";
    } else {
      el.textContent = text;
      fitText(el, text);
      disp.style.background = color || "#111";
      if (blink) {
        disp.style.setProperty("--bc", color || "#c62828");
        disp.classList.add("blink");
      }
    }
  }

  function fitText(el, text) {
    const len = [...text].length;
    let vw;
    if (len <= 3) vw = 28;
    else if (len <= 5) vw = 20;
    else if (len <= 8) vw = 14;
    else if (len <= 14) vw = 10;
    else vw = 7;
    el.style.fontSize = vw + "vw";
  }

  function setBadge(text, cls) {
    const b = $("connBadge");
    b.textContent = text;
    b.className = cls || "";
  }

  $("fsBtn").addEventListener("click", () => {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  });

  /* ============ 操作用 ============ */
  function startCtrl(roomName) {
    role = "ctrl";
    show("ctrl");
    if (roomName) {
      $("codeInput").value = roomName;
      connect();
    } else {
      const saved = localStorage.getItem("kanpeRoom");
      if (saved) $("codeInput").value = saved;
    }
  }

  function connect() {
    const r = $("codeInput").value.trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (r.length < 2) { setCtrlStatus("ルーム名は英数字2文字以上", "ng"); return; }
    localStorage.setItem("kanpeRoom", r);

    // 前のルームの監視を解除
    if (room) {
      roomRef("current").off();
      roomRef("presence/display").off();
    }
    if (hbTimer) clearInterval(hbTimer);
    if (watchTimer) clearInterval(watchTimer);

    room = r;
    setCtrlStatus("接続中...", "");

    roomRef("current").on("value", (snap) => {
      const d = snap.val();
      if (d && typeof d.text === "string") {
        $("nowText").textContent = d.text === "" ? "(クリア)" : d.text;
      }
    });

    startPresence("ctrl", "display", (alive, offline) => {
      if (offline) setCtrlStatus("ネット接続なし", "ng");
      else if (alive) setCtrlStatus("表示側と接続OK", "ok");
      else setCtrlStatus("表示側が見つかりません(表示側を開いてください)", "ng");
    });
  }

  function sendMsg(text, color, blink) {
    if (!room) { setCtrlStatus("先にルームへ接続してください", "ng"); return; }
    roomRef("current").set({ text, color: color || null, blink: !!blink, ts: firebase.database.ServerValue.TIMESTAMP })
      .catch(() => setCtrlStatus("送信失敗 — ネットとFirebaseルールを確認", "ng"));
  }

  function setCtrlStatus(text, cls) {
    const s = $("ctrlStatus");
    s.textContent = text;
    s.className = cls || "";
  }

  /* ============ イベント ============ */
  $("btnDisplayMode").addEventListener("click", () => startDisplay(promptRoom()));
  $("btnCtrlMode").addEventListener("click", () => startCtrl());
  $("connectBtn").addEventListener("click", connect);
  $("codeInput").addEventListener("keydown", (e) => { if (e.key === "Enter") connect(); });

  function promptRoom() {
    const saved = localStorage.getItem("kanpeRoom") || "TEDX2026";
    const r = (prompt("ルーム名(操作側と同じにする):", saved) || saved)
      .trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
    localStorage.setItem("kanpeRoom", r);
    return r || "TEDX2026";
  }

  document.querySelectorAll(".btnGrid button").forEach(b => {
    b.addEventListener("click", () => sendMsg(b.dataset.text, b.dataset.color || null, b.dataset.blink === "1"));
  });
  $("sendFree").addEventListener("click", () => sendFreeMsg(false));
  $("sendFreeUrgent").addEventListener("click", () => sendFreeMsg(true));
  $("freeText").addEventListener("keydown", (e) => { if (e.key === "Enter") sendFreeMsg(false); });
  function sendFreeMsg(urgent) {
    const t = $("freeText").value.trim();
    if (!t) return;
    sendMsg(t, urgent ? "#cc0000" : "#1565c0", urgent);
    $("freeText").value = "";
    $("freeText").focus();
  }

  // URLパラメータで自動起動: ?mode=display&room=TEDX2026 / ?mode=ctrl&room=TEDX2026
  (function autoStart() {
    const p = new URLSearchParams(location.search);
    const mode = (p.get("mode") || "").toLowerCase();
    const r = (p.get("room") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (mode === "display") startDisplay(r || "TEDX2026");
    else if (mode === "ctrl") startCtrl(r || null);
  })();
})();
</script>
</body>
</html>
